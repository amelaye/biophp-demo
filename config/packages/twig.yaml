twig:
    default_path: '%kernel.project_dir%/templates'
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    exception_controller: null

    # ------------------------------------------------------------------
    # Navigation BioPHP : source unique pour la page d'index, la barre de
    # navigation et la barre latérale des pages d'exemples.
    # 'icon' renvoie à un symbole de templates/partials/icons.html.twig
    # ------------------------------------------------------------------
    globals:
        bp_repo_url: 'https://github.com/amelaye/biophp-demo'

        # langues du sélecteur de la page d'accueil (voir App\EventSubscriber\LocaleSubscriber)
        bp_locales: '%app.supported_locales%'

        bp_samples:
            -   group: 'group.sequencing'
                items:
                    -   { route: 'sequence_analysis',          icon: 'dna',      title: 'sample.sequence_analysis.title', desc: 'sample.sequence_analysis.desc' }
                    -   { route: 'sequence_alignment_fasta',   icon: 'align',    title: 'sample.sequence_alignment_fasta.title',         desc: 'sample.sequence_alignment_fasta.desc' }
                    -   { route: 'sequence_alignment_clustal', icon: 'align',    title: 'sample.sequence_alignment_clustal.title',          desc: 'sample.sequence_alignment_clustal.desc' }
                    -   { route: 'play_with_sequencies',       icon: 'shuffle',  title: 'sample.play_with_sequencies.title',     desc: 'sample.play_with_sequencies.desc' }
                    -   { route: 'play_with_proteins',         icon: 'protein',  title: 'sample.play_with_proteins.title',       desc: 'sample.play_with_proteins.desc' }
                    -   { route: 'sequence_match',             icon: 'target',   title: 'sample.sequence_match.title',           desc: 'sample.sequence_match.desc' }
                    -   { route: 'restriction_enzyme',         icon: 'scissors', title: 'sample.restriction_enzyme.title',       desc: 'sample.restriction_enzyme.desc' }
            -   group: 'group.database_parsers'
                items:
                    -   { route: 'read_sequence_genbank',   icon: 'database', title: 'sample.read_sequence_genbank.title',   desc: 'sample.read_sequence_genbank.desc' }
                    -   { route: 'read_sequence_swissprot', icon: 'database', title: 'sample.read_sequence_swissprot.title', desc: 'sample.read_sequence_swissprot.desc' }
                    -   { route: 'read_sequence_prf',       icon: 'file',     title: 'sample.read_sequence_prf.title',       desc: 'sample.read_sequence_prf.desc' }
                    -   { route: 'read_sequence_pir',       icon: 'file',     title: 'sample.read_sequence_pir.title',       desc: 'sample.read_sequence_pir.desc' }
                    -   { route: 'read_sequence_unigene',   icon: 'file',     title: 'sample.read_sequence_unigene.title',   desc: 'sample.read_sequence_unigene.desc' }
                    -   { route: 'read_sequence_genome',    icon: 'file',     title: 'sample.read_sequence_genome.title',    desc: 'sample.read_sequence_genome.desc' }
                    -   { route: 'read_sequence_hgbase',    icon: 'file',     title: 'sample.read_sequence_hgbase.title',    desc: 'sample.read_sequence_hgbase.desc' }
                    -   { route: 'read_sequence_prints',    icon: 'file',     title: 'sample.read_sequence_prints.title',    desc: 'sample.read_sequence_prints.desc' }
                    -   { route: 'read_sequence_prodom',    icon: 'file',     title: 'sample.read_sequence_prodom.title',    desc: 'sample.read_sequence_prodom.desc' }
                    -   { route: 'read_sequence_aaindex',   icon: 'file',     title: 'sample.read_sequence_aaindex.title',   desc: 'sample.read_sequence_aaindex.desc' }
                    -   { route: 'read_sequence_epd',       icon: 'file',     title: 'sample.read_sequence_epd.title',       desc: 'sample.read_sequence_epd.desc' }

        bp_tools:
            -   { route: 'chaos_game_representation', params: { schema: 'FCGR' }, icon: 'grid', title: 'tool.chaos_game_representation_fcgr.title', desc: 'tool.chaos_game_representation_fcgr.desc', badge: 'FCGR' }
            -   { route: 'chaos_game_representation', params: { schema: 'CGR' },  icon: 'grid', title: 'tool.chaos_game_representation_cgr.title', desc: 'tool.chaos_game_representation_cgr.desc', badge: 'CGR' }
            -   { route: 'distance_among_sequences',  icon: 'ruler',    title: 'tool.distance_among_sequences.title',             desc: 'tool.distance_among_sequences.desc', badge: 'Stats' }
            -   { route: 'dna_to_protein',            icon: 'atgc',     title: 'tool.dna_to_protein.title',           desc: 'tool.dna_to_protein.desc', badge: 'DNA' }
            -   { route: 'find_palindromes',          icon: 'search',   title: 'tool.find_palindromes.title',         desc: 'tool.find_palindromes.desc', badge: 'DNA' }
            -   { route: 'gc_content_finder',         icon: 'percent',  title: 'tool.gc_content_finder.title',                    desc: 'tool.gc_content_finder.desc', badge: 'DNA' }
            -   { route: 'melting_temperature',       icon: 'thermo',   title: 'tool.melting_temperature.title', desc: 'tool.melting_temperature.desc', badge: 'DNA' }
            -   { route: 'micro_array_analysis_adaptive_quantification', icon: 'chart', title: 'tool.micro_array_analysis_adaptive_quantification.title', desc: 'tool.micro_array_analysis_adaptive_quantification.desc', badge: 'Stats' }
            -   { route: 'microsatellite_repeats_finder', icon: 'search', title: 'tool.microsatellite_repeats_finder.title',      desc: 'tool.microsatellite_repeats_finder.desc', badge: 'DNA' }
            -   { route: 'oligonucleotide_frequency', icon: 'chart',    title: 'tool.oligonucleotide_frequency.title',             desc: 'tool.oligonucleotide_frequency.desc', badge: 'Stats' }
            -   { route: 'pcr_amplification',         icon: 'dna',      title: 'tool.pcr_amplification.title',                    desc: 'tool.pcr_amplification.desc', badge: 'DNA' }
            -   { route: 'protein_properties',        icon: 'flask',    title: 'tool.protein_properties.title',          desc: 'tool.protein_properties.desc', badge: 'Protein' }
            -   { route: 'protein_to_dna',            icon: 'protein',  title: 'tool.protein_to_dna.title',   desc: 'tool.protein_to_dna.desc', badge: 'Protein' }
            -   { route: 'random_seqs',               icon: 'shuffle',  title: 'tool.random_seqs.title',                     desc: 'tool.random_seqs.desc', badge: 'Tools' }
            -   { route: 'reduce_protein_alphabet',   icon: 'protein',  title: 'tool.reduce_protein_alphabet.title',       desc: 'tool.reduce_protein_alphabet.desc', badge: 'Protein' }
            -   { route: 'restriction_digest',        icon: 'scissors', title: 'tool.restriction_digest.title',     desc: 'tool.restriction_digest.desc', badge: 'DNA' }
            -   { route: 'seq_alignment',             icon: 'align',    title: 'tool.seq_alignment.title',                   desc: 'tool.seq_alignment.desc', badge: 'Aligner' }
            -   { route: 'sequences_manipulation_and_data', icon: 'atgc', title: 'tool.sequences_manipulation_and_data.title',          desc: 'tool.sequences_manipulation_and_data.desc', badge: 'DNA' }
            -   { route: 'skews',                     icon: 'wave',     title: 'tool.skews.title',                      desc: 'tool.skews.desc', badge: 'Stats' }
            -   { route: 'useful_formulas',           icon: 'calc',     title: 'tool.useful_formulas.title',                    desc: 'tool.useful_formulas.desc', badge: 'Tools' }
