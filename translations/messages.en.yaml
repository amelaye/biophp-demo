note:
    biophp_credit: 'Text taken from %source%.'
    insilico: >-
        This script has been extracted from online tools at
        <a href="http://insilico.ehu.es/" target="_blank" rel="noopener">insilico.ehu.es</a>.
        CGR images for all sequenced bacterial genomes are available
        <a href="http://insilico.ehu.es/describe/" target="_blank" rel="noopener">here</a>.
        To understand how CGR images are generated, check
        <a href="http://insilico.ehu.es/describe/CGR/info_position_CGR.html" target="_blank" rel="noopener">here</a>.
        Example representations for <i>E. coli</i> K12 :
        <a href="http://insilico.ehu.es/mini_tools/CGR-FCGR/E_coli_K12_CGR.html" target="_blank" rel="noopener">CGR</a>,
        <a href="http://insilico.ehu.es/mini_tools/CGR-FCGR/E_coli_K12_FCGR.html" target="_blank" rel="noopener">FCGR</a>.
        Text taken from <cite title="Source Title">biophp.org</cite>.

