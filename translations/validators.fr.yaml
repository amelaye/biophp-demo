# Messages de validation de amelaye/biotools (domaine « validators », clés en anglais).
# Ceux qui concatènent une valeur variable au texte ne peuvent pas être traduits ici.
"Sequence is not valid. At least one letter in the sequence is unknown (not a NC-UIBMB valid code)": "La séquence n'est pas valide : au moins une lettre est inconnue (ce n'est pas un code NC-IUBMB valide)."
"No sequence available": "Aucune séquence fournie."
"The oligonucleotide is not valid.": "L'oligonucléotide n'est pas valide."
"Length of primer must be 6-50 bp.": "L'amorce doit mesurer de 6 à 50 pb."
"Query sequence not provided. Plase go back and try again.": "Aucune séquence fournie. Revenez en arrière et réessayez."
"Sequence is too long.": "La séquence est trop longue."
"Sequence is very small for the selected window size.": "La séquence est trop courte pour la taille de fenêtre choisie."
"The custom code is not correct (is not 64 characters long)": "Le code personnalisé n'est pas correct (il ne fait pas 64 caractères)."
"The maximum length of code accepted for both sequences is 300 nucleotides": "Les deux séquences ne peuvent pas dépasser 300 nucléotides au total."
"The nearest-neighbor Tm needs a salt or a Mg2+ concentration above 0.": "La Tm nearest-neighbor demande une concentration en sel ou en Mg2+ supérieure à 0."
"The personalized alphabet is not correct": "L'alphabet personnalisé n'est pas correct."
"Tick at least one of the two Tm methods.": "Cochez au moins une des deux méthodes de Tm."
"Maximum lengt of sequence allowed is {{ limit }} bp.": "La séquence ne peut pas dépasser {{ limit }} pb."
"Minumum sequence length: {{ limit }} bp": "Longueur minimale de la séquence : {{ limit }} pb."
"Query sequence must be at least 4^(length of oligo) to proceed.": "La séquence doit mesurer au moins 4^(longueur de l'oligo) pour être traitée."
"Sequence is longer than {{ limit }} bp. At this moment we can not provide this service to such a long sequences.": "La séquence dépasse {{ limit }} pb : ce service ne traite pas encore des séquences aussi longues."
"This service does not handle input requests longer than {{ limit }} bp.": "Ce service ne traite pas les séquences de plus de {{ limit }} pb."
